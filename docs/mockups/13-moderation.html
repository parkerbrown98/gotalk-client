<style>
  .place-nav { width: 220px; flex: none; background: var(--gt-color-canvas); padding: 16px 8px; display: flex; flex-direction: column; gap: 2px; }
  .pane { flex: 1; min-width: 0; padding: 28px 36px; overflow: hidden; display: flex; flex-direction: column; gap: 16px; }
  .pane > .inner { width: 640px; display: flex; flex-direction: column; gap: 14px; }
  .mini-shell { flex: 1; min-height: 0; display: flex; }
  .quote { padding: 10px 12px; max-height: 62px; overflow: hidden; border-radius: var(--gt-radius-md); background: var(--gt-color-surface-elevated); border: 1px solid var(--gt-color-hairline); }
  .role-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; background: var(--gt-color-accent-blue); }
  .scrim { position: absolute; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center; }
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; background: var(--gt-color-surface-elevated); border-top: 1px solid var(--gt-color-hairline-strong); border-radius: var(--gt-radius-xl) var(--gt-radius-xl) 0 0; padding: 24px 16px 32px; display: flex; flex-direction: column; gap: 16px; }
  .grab { width: 36px; height: 4px; border-radius: 2px; background: var(--gt-color-stone); margin: -12px auto 0; }
  .opts { display: flex; flex-direction: column; gap: 8px; }
  .opt { display: flex; gap: 12px; padding: 10px 12px; border: 1px solid var(--gt-color-hairline); border-radius: var(--gt-radius-md); background: var(--gt-color-surface-elevated); }
  .opt.on { border-color: var(--gt-color-hairline-strong); background: var(--gt-color-surface-card); }
  .opt .dot { width: 16px; height: 16px; margin-top: 3px; border-radius: 50%; border: 1px solid var(--gt-color-hairline-strong); }
  .opt.on .dot::after { content: ''; display: block; width: 8px; height: 8px; margin: 3px; border-radius: 50%; background: var(--gt-color-primary); }
  .stat-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; }
  .bar-row { display: grid; grid-template-columns: 118px 1fr 28px; gap: 10px; align-items: center; }
  .bar { height: 8px; border-radius: var(--gt-radius-full); background: var(--gt-color-surface-elevated); overflow: hidden; }
  .bar span { display: block; height: 100%; background: var(--gt-color-on-dark-mute); }
</style>

<body>
<main class="board">
  <header class="board-head">
    <nav><a href="index.html">Mockups</a> / Phase 6 · Moderation and admin</nav>
    <h1 class="t-display-lg">Moderation</h1>
    <p>Reports come from members using Report on a post, message or person. Moderators work the queue, act on members, and every action is recorded in the audit log; the place publishes moderation statistics.</p>
  </header>

  <section class="group">
    <h2>Web and desktop</h2>
    <div class="frames">
      <figure class="frame"><div class="win short"><div class="chrome"><span class="title">Gotalk</span></div><div class="viewport"><div class="rail"><div class="tile yellow place active">O</div><div class="avatar blue" style="margin-top:auto">MK</div></div><aside class="sidebar"><div class="head"><span class="t-body-strong">Open Woodworkers</span></div><div class="items"><a class="nav-row active"><svg><use href="#hash"/></svg>bench-talk</a></div></aside><div class="main"><div class="topbar"><svg class="i mute"><use href="#settings"/></svg><span class="t-body-strong">Place settings</span></div><div class="mini-shell"><nav class="place-nav hairline-r"><div class="section-label">Place</div><a class="nav-row"><svg><use href="#settings"/></svg>General</a><a class="nav-row"><svg><use href="#users"/></svg>Invites</a><a class="nav-row"><svg><use href="#shield"/></svg>Roles</a><a class="nav-row"><svg><use href="#lock"/></svg>Permissions</a><div class="section-label">Moderation</div><a class="nav-row"><svg><use href="#user"/></svg>Members</a><a class="nav-row active"><svg><use href="#flag"/></svg>Reports<span class="meta"><span class="count">3</span></span></a><a class="nav-row"><svg><use href="#x"/></svg>Bans</a><a class="nav-row"><svg><use href="#clock"/></svg>Audit log</a><div class="section-label">Integrations</div><a class="nav-row"><svg><use href="#link"/></svg>Webhooks</a><a class="nav-row"><svg><use href="#bot"/></svg>Bots</a><div class="hairline-t" style="margin-top:auto;padding-top:8px"><a class="nav-row"><svg><use href="#eye"/></svg>Transparency report</a></div></nav><div class="pane scroll-y"><div class="inner"><div class="col gap-xs"><h2 class="t-heading-xl">Reports</h2><p class="mute t-body-sm">Reports from members, newest first. Resolving or dismissing one records it in the audit log.</p></div><div class="pills"><span class="pill active">Open</span><span class="pill">Resolved</span><span class="pill">Dismissed</span></div><div class="card compact"><div class="flex between center"><span><span class="badge warning">Harassment</span> <span class="t-caption-md mute">Message in #bench-talk</span></span><span class="t-caption-md mute">4 min ago</span></div><span class="t-caption-md mute">Reported by Ana L.</span><div class="flex center gap-sm"><span class="avatar red">TR</span><div class="col"><span class="t-body-sm-strong">Tom R.</span><span class="t-caption-md mute">@tom.r</span></div></div><div class="quote t-body-sm">Stop posting your crooked jig advice here. Nobody asked for your scraps.</div><p class="t-caption-md mute"><i>“This is getting personal in the channel.”</i></p><div class="flex gap-sm wrap"><button class="btn btn-outline small">Open in context</button><button class="btn btn-tertiary small">Act on Tom R.…</button><span class="grow"></span><button class="btn btn-tertiary small">Dismiss</button><button class="btn btn-outline small">Resolve</button></div></div><div class="card compact"><div class="flex between center"><span><span class="badge">Spam</span> <span class="t-caption-md mute">Post in Dovetails keep gapping</span></span><span class="t-caption-md mute">21 min ago</span></div><span class="t-caption-md mute">Reported by Jo P.</span><div class="quote t-body-sm">Visit my off-site store for plans, tools and fast money with this link.</div><div class="flex gap-sm wrap"><button class="btn btn-outline small">Open in context</button><button class="btn btn-tertiary small">Act on Jo P.…</button><span class="grow"></span><button class="btn btn-tertiary small">Dismiss</button><button class="btn btn-outline small">Resolve</button></div></div><div class="card compact"><div class="flex between center"><span><span class="badge warning">Harassment</span> <span class="t-caption-md mute">Member</span></span><span class="t-caption-md mute">1 h ago</span></div><span class="t-caption-md mute">Reported by Ana L.</span><div class="quote t-body-sm">Profile and recent messages are attached for moderators.</div></div></div></div></div></div></div></div><figcaption>Reports queue. Requires Manage reports; the place settings nav shows only sections the moderator can open and keeps the report count visible.</figcaption></figure>

      <figure class="frame"><div class="win short"><div class="chrome"><span class="title">Gotalk</span></div><div class="viewport"><div class="rail"><div class="tile yellow place active">O</div></div><div class="main"><div class="topbar"><span class="t-body-strong">Reports</span></div></div><div class="scrim"><div class="card dialog" style="width:430px;background:var(--gt-color-surface-elevated);border-color:var(--gt-color-hairline-strong);border-radius:var(--gt-radius-xl)"><h2 class="t-heading-md">Resolve this report?</h2><p class="mute t-body-sm">The report leaves the open queue.</p><div class="field"><label>Note</label><div class="input" style="height:86px;align-items:flex-start"><span class="ph">What you did, for other moderators</span></div><span class="note">Recorded in the audit log.</span></div><div class="flex gap-sm" style="justify-content:flex-end"><button class="btn btn-tertiary">Cancel</button><button class="btn btn-primary">Resolve</button></div></div></div></div></div><figcaption>Resolve dialog. Requires Manage reports; Dismiss uses the same dialog so the audit log explains the queue change.</figcaption></figure>

      <figure class="frame"><div class="win short"><div class="chrome"><span class="title">Gotalk</span></div><div class="viewport"><div class="rail"><div class="tile yellow place active">O</div></div><aside class="sidebar"><div class="head"><span class="t-body-strong">Open Woodworkers</span></div><div class="items"><a class="nav-row active"><svg><use href="#hash"/></svg>bench-talk</a></div></aside><div class="main"><div class="topbar"><span class="t-body-strong">bench-talk</span></div><div class="pane" style="opacity:.45"><div class="list-row"><span class="avatar red">TR</span><span>That jig is a waste of maple.</span><svg class="i mute" style="margin-left:auto"><use href="#more"/></svg></div></div></div><div class="scrim"><div class="card dialog" style="width:520px;background:var(--gt-color-surface-elevated);border-color:var(--gt-color-hairline-strong);border-radius:var(--gt-radius-xl)"><h2 class="t-heading-md">Report this message</h2><p class="mute t-body-sm">The moderators of Open Woodworkers see the report, the message as it is now, and who sent it.</p><div class="opts"><div class="opt"><span class="dot"></span><div><span class="t-body-sm-strong">Spam</span><p class="t-caption-md mute">Ads, scams or repeated junk</p></div></div><div class="opt on"><span class="dot"></span><div><span class="t-body-sm-strong">Harassment</span><p class="t-caption-md mute">Attacks or threats against someone</p></div></div><div class="opt"><span class="dot"></span><div><span class="t-body-sm-strong">Inappropriate</span><p class="t-caption-md mute">Not suitable for this place</p></div></div><div class="opt"><span class="dot"></span><div><span class="t-body-sm-strong">Off topic</span><p class="t-caption-md mute">Belongs somewhere else</p></div></div><div class="opt"><span class="dot"></span><div><span class="t-body-sm-strong">Other</span><p class="t-caption-md mute">Something else; explain below</p></div></div></div><div class="field"><label>Details (optional)</label><div class="input" style="height:70px;align-items:flex-start"><span class="ph">Add context</span></div></div><div class="flex gap-sm" style="justify-content:flex-end"><button class="btn btn-tertiary">Cancel</button><button class="btn btn-primary">Send report</button></div></div></div></div></div><figcaption>Report dialog. Any member can report from a message menu; the server snapshots the target so later edits do not hide it.</figcaption></figure>

      <figure class="frame"><div class="win short"><div class="chrome"><span class="title">Gotalk</span></div><div class="viewport"><div class="rail"><div class="tile yellow place active">O</div></div><div class="main"></div><div class="scrim"><div class="card dialog" style="width:390px;background:var(--gt-color-surface-elevated);border-color:var(--gt-color-hairline-strong);border-radius:var(--gt-radius-xl)"><div class="notice success"><svg class="i"><use href="#check"/></svg><span><b>Report sent.</b> The moderators will take a look.</span></div><div class="flex" style="justify-content:flex-end"><button class="btn btn-primary">Done</button></div></div></div></div></div><figcaption>Report sent state. Members get confirmation without seeing who handles the report or any moderation tools.</figcaption></figure>

      <figure class="frame"><div class="win short"><div class="chrome"><span class="title">Gotalk</span></div><div class="viewport"><div class="rail"><div class="tile yellow place active">O</div><div class="avatar blue" style="margin-top:auto">MK</div></div><div class="main"><div class="topbar"><span class="t-body-strong">Members</span></div><div class="mini-shell"><nav class="place-nav hairline-r"><div class="section-label">Moderation</div><a class="nav-row active"><svg><use href="#user"/></svg>Members</a><a class="nav-row"><svg><use href="#flag"/></svg>Reports<span class="meta"><span class="count">3</span></span></a><a class="nav-row"><svg><use href="#x"/></svg>Bans</a><a class="nav-row"><svg><use href="#clock"/></svg>Audit log</a></nav><div class="pane"><div class="inner"><div class="col gap-xs"><h2 class="t-heading-xl">Members</h2><p class="mute t-body-sm">Search by name and open the actions you are allowed to take.</p></div><div class="input search"><svg class="i mute"><use href="#search"/></svg><span class="ph">Search by name</span></div><div class="card flush"><div class="list-row"><span class="avatar blue">MK</span><div class="col grow"><span class="t-body-sm-strong">Marta K. <span class="badge">Owner</span></span><span class="t-caption-md mute">@marta.k · joined Jan 2024 · <span class="role-dot"></span> Admin</span></div><svg class="i mute"><use href="#chevronRight"/></svg></div><div class="list-row"><span class="avatar green">AL</span><div class="col grow"><span class="t-body-sm-strong">Ana L.</span><span class="t-caption-md mute">@ana.l · joined Feb 2024 · <span class="role-dot" style="background:var(--gt-color-accent-green)"></span> Moderator</span></div><svg class="i mute"><use href="#chevronRight"/></svg></div><div class="list-row"><span class="avatar red">TR</span><div class="col grow"><span class="t-body-sm-strong">Tom R. <span class="badge warning">Timed out · 2 h left</span></span><span class="t-caption-md mute">@tom.r · joined Mar 2024 · <span class="role-dot" style="background:var(--gt-color-accent-yellow)"></span> Helper</span></div><svg class="i mute"><use href="#chevronRight"/></svg></div><div class="list-row"><span class="avatar yellow">JP</span><div class="col grow"><span class="t-body-sm-strong">Jo P. <span class="badge">Bot</span></span><span class="t-caption-md mute">@jo.p · joined Mar 2024</span></div><svg class="i mute"><use href="#chevronRight"/></svg></div></div></div></div></div></div></div></div><figcaption>Members. Shown for any of Kick, Ban, Moderate members, Manage roles or Manage nicknames; tapping opens actions.</figcaption></figure>

      <figure class="frame"><div class="win short"><div class="chrome"><span class="title">Gotalk</span></div><div class="viewport"><div class="rail"><div class="tile yellow place active">O</div></div><div class="main"></div><div class="scrim"><div class="card dialog scroll-y" style="width:520px;max-height:560px;background:var(--gt-color-surface-elevated);border-color:var(--gt-color-hairline-strong);border-radius:var(--gt-radius-xl)"><div class="flex center gap-md"><span class="avatar red" style="width:52px;height:52px">TR</span><div class="col"><h2 class="t-heading-md">Tom R.</h2><span class="t-caption-md mute">@tom.r · Member since Mar 2024 · Timed out for 2 more hours</span></div></div><div class="card compact"><span class="t-body-sm-strong">Roles</span><label class="check"><span class="box on"><svg><use href="#check"/></svg></span><span>Moderator</span></label><label class="check"><span class="box"></span><span>Helper</span></label><label class="check"><span class="box" style="opacity:.45"></span><span class="mute">Admin <span class="note">Above your highest role</span></span></label></div><div class="field"><label>Nickname</label><div class="input"><span>Tom R.</span><button class="btn btn-outline small" style="margin-left:auto">Save</button></div></div><div class="card flush"><div class="list-row"><svg class="i warning"><use href="#alert"/></svg><span class="grow t-body-sm-strong">Warn</span></div><div class="list-row"><svg class="i mute"><use href="#clock"/></svg><span class="grow t-body-sm-strong">Remove timeout</span></div><div class="list-row"><svg class="i danger"><use href="#logout"/></svg><span class="grow t-body-sm-strong danger">Kick</span></div><div class="list-row"><svg class="i danger"><use href="#x"/></svg><span class="grow t-body-sm-strong danger">Ban</span></div><div class="list-row"><svg class="i mute"><use href="#clock"/></svg><span class="grow t-body-sm-strong">Moderation history</span></div></div></div></div></div></div><figcaption>Member actions. Rows appear per permission; the owner and yourself cannot be acted on, and higher roles are disabled.</figcaption></figure>

      <figure class="frame"><div class="win short"><div class="chrome"><span class="title">Gotalk</span></div><div class="viewport"><div class="rail"><div class="tile yellow place active">O</div></div><div class="main"></div><div class="scrim"><div class="card dialog" style="width:450px;background:var(--gt-color-surface-elevated);border-color:var(--gt-color-hairline-strong);border-radius:var(--gt-radius-xl)"><h2 class="t-heading-md">Time out Tom R.</h2><p class="mute t-body-sm">They can still read, but cannot post, reply, react or join voice until it ends. They are told why.</p><div class="field"><label>Duration</label><div class="pills"><span class="pill">60 seconds</span><span class="pill">5 minutes</span><span class="pill">10 minutes</span><span class="pill active">1 hour</span><span class="pill">1 day</span><span class="pill">1 week</span></div></div><div class="field"><label>Reason</label><div class="input"><span class="ph">Shown to Tom R. and moderators</span></div></div><div class="flex gap-sm" style="justify-content:flex-end"><button class="btn btn-tertiary">Cancel</button><button class="btn btn-primary">Time out</button></div></div></div></div></div><figcaption>Time out dialog. Requires Moderate members; the duration and reason are written to the audit log.</figcaption></figure>

      <figure class="frame"><div class="win short"><div class="chrome"><span class="title">Gotalk</span></div><div class="viewport"><div class="rail"><div class="tile yellow place active">O</div></div><div class="main"></div><div class="scrim"><div class="card dialog" style="width:450px;background:var(--gt-color-surface-elevated);border-color:var(--gt-color-hairline-strong);border-radius:var(--gt-radius-xl)"><h2 class="t-heading-md">Ban Tom R.?</h2><p class="mute t-body-sm">Removes them from Open Woodworkers and stops them joining again until the ban lifts.</p><div class="field"><label>Duration</label><div class="pills"><span class="pill active">Permanent</span><span class="pill">1 day</span><span class="pill">7 days</span><span class="pill">30 days</span></div></div><div class="field"><label>Reason</label><div class="input"><span class="ph">Required for moderators</span></div></div><div class="flex gap-sm" style="justify-content:flex-end"><button class="btn btn-tertiary">Cancel</button><button class="btn btn-danger">Ban</button></div></div></div></div></div><figcaption>Ban dialog. Requires Ban members; Warn requires a reason and Kick can be sent with or without one.</figcaption></figure>

      <figure class="frame"><div class="win short"><div class="chrome"><span class="title">Gotalk</span></div><div class="viewport"><div class="rail"><div class="tile yellow place active">O</div></div><div class="main"><div class="topbar"><span class="t-body-strong">Bans</span></div><div class="mini-shell"><nav class="place-nav hairline-r"><div class="section-label">Moderation</div><a class="nav-row"><svg><use href="#user"/></svg>Members</a><a class="nav-row"><svg><use href="#flag"/></svg>Reports</a><a class="nav-row active"><svg><use href="#x"/></svg>Bans</a><a class="nav-row"><svg><use href="#clock"/></svg>Audit log</a></nav><div class="pane"><div class="inner"><div class="flex between center"><div class="col gap-xs"><h2 class="t-heading-xl">Bans</h2><p class="mute t-body-sm">People who cannot join this place. Lifting a ban lets them join again; it does not invite them back.</p></div><button class="btn btn-tertiary">Ban by username</button></div><div class="card flush"><div class="list-row"><span class="avatar red">TR</span><div class="col grow"><span class="t-body-sm-strong">Tom R.</span><span class="t-caption-md mute">@tom.r · banned 3 days ago by you</span><span class="t-caption-md mute">Spamming links in #bench-talk</span></div><span class="t-caption-md mute">Permanent</span><button class="btn btn-outline small">Unban</button></div><div class="list-row"><span class="avatar yellow">JP</span><div class="col grow"><span class="t-body-sm-strong">Jo P.</span><span class="t-caption-md mute">@jo.p · banned yesterday by Ana L.</span><span class="t-caption-md mute">Repeated off-topic posts</span></div><span class="t-caption-md mute">Lifts in 6 days</span><button class="btn btn-outline small">Unban</button></div></div></div></div></div></div></div></div><figcaption>Bans. Requires Ban members; unbanning restores the ability to join but does not create an invite.</figcaption></figure>

      <figure class="frame"><div class="win short"><div class="chrome"><span class="title">Gotalk</span></div><div class="viewport"><div class="rail"><div class="tile yellow place active">O</div></div><div class="main"><div class="topbar"><span class="t-body-strong">Audit log</span></div><div class="mini-shell"><nav class="place-nav hairline-r"><div class="section-label">Moderation</div><a class="nav-row"><svg><use href="#user"/></svg>Members</a><a class="nav-row"><svg><use href="#flag"/></svg>Reports</a><a class="nav-row"><svg><use href="#x"/></svg>Bans</a><a class="nav-row active"><svg><use href="#clock"/></svg>Audit log</a></nav><div class="pane"><div class="inner"><div class="col gap-xs"><h2 class="t-heading-xl">Audit log</h2><p class="mute t-body-sm">Every moderation and administration action in this place, newest first.</p></div><div class="pills"><span class="pill active">All</span><span class="pill">Members</span><span class="pill">Roles</span><span class="pill">Channels</span><span class="pill">Messages</span><span class="pill">Forums</span><span class="pill">Topics</span><span class="pill">Posts</span><span class="pill">Reports</span><span class="pill">Webhooks</span><span class="pill">Place</span></div><div class="card flush"><div class="list-row"><span class="avatar s32 blue">MK</span><div class="col grow"><span class="t-body-sm"><b>Marta K.</b> banned <b>Tom R.</b> for 7 days</span><span class="t-caption-md mute">“Spamming links in #bench-talk”</span></div><span class="t-caption-md mute">Now</span></div><div class="list-row"><span class="avatar s32 green">AL</span><span class="grow t-body-sm"><b>Ana L.</b> timed out <b>Tom R.</b> for 1 hour</span><span class="t-caption-md mute">12m</span></div><div class="list-row"><span class="avatar s32 blue">MK</span><span class="grow t-body-sm">Removed a message by <b>Jo P.</b> in #bench-talk</span><span class="t-caption-md mute">18m</span></div><div class="list-row"><span class="avatar s32 blue">MK</span><span clas
