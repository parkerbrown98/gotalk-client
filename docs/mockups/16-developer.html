<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1400">
<title>Developer tools · Gotalk mockups</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../packages/tokens/dist/tokens.css">
<link rel="stylesheet" href="mockups.css">
<style>
  .settings-nav { width: 248px; flex: none; background: var(--gt-color-surface); border-right: 1px solid var(--gt-color-hairline); padding: 16px 8px; display: flex; flex-direction: column; gap: 2px; }
  .place-nav { width: 220px; flex: none; background: var(--gt-color-canvas); padding: 16px 8px; display: flex; flex-direction: column; gap: 2px; }
  .body-pane { flex: 1; min-width: 0; padding: 30px 38px; overflow: hidden; display: flex; flex-direction: column; gap: 16px; }
  .body-pane > .inner { width: 640px; display: flex; flex-direction: column; gap: 16px; }
  .mini-shell { flex: 1; min-height: 0; display: flex; }
  .scrim { position: absolute; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center; }
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; background: var(--gt-color-surface-elevated); border-top: 1px solid var(--gt-color-hairline-strong); border-radius: var(--gt-radius-xl) var(--gt-radius-xl) 0 0; padding: 24px 16px 32px; display: flex; flex-direction: column; gap: 16px; }
  .grab { width: 36px; height: 4px; border-radius: 2px; background: var(--gt-color-stone); margin: -12px auto 0; }
  .linkbox { display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 12px; border-radius: var(--gt-radius-md); border: 1px solid var(--gt-color-hairline); background: var(--gt-color-surface); }
  .linkbox span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--gt-font-mono); color: var(--gt-color-on-dark); }
  .option-card { padding: 12px; border: 1px solid var(--gt-color-hairline); border-radius: var(--gt-radius-md); background: var(--gt-color-surface); display: flex; flex-direction: column; gap: 10px; }
  .events { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px 12px; }
  pre { margin: 0; padding: 12px; border-radius: var(--gt-radius-md); background: var(--gt-color-surface-elevated); border: 1px solid var(--gt-color-hairline); color: var(--gt-color-on-dark); font-family: var(--gt-font-mono); font-size: 12px; overflow: hidden; }
</style>
</head>
<body>
<main class="board">
  <header class="board-head">
    <nav><a href="index.html">Mockups</a> / Phase 6 · Moderation and admin</nav>
    <h1 class="t-display-lg">Developer tools</h1>
    <p>Personal access tokens for scripts, applications with bot accounts and slash commands, and outgoing webhooks for places. Secrets are shown once.</p>
  </header>

  <section class="group">
    <h2>Web and desktop</h2>
    <div class="frames">
      <figure class="frame"><div class="win short"><div class="chrome"><div class="dots"><i></i><i></i><i></i></div><div class="url">app.gotalk.io/settings/tokens</div></div><div class="viewport"><nav class="settings-nav"><a class="nav-row" style="margin-bottom:8px"><svg><use href="#chevronLeft"/></svg>Back to Woodworkers</a><div class="section-label">Account</div><a class="nav-row"><svg><use href="#user"/></svg>Profile</a><a class="nav-row"><svg><use href="#lock"/></svg>Password</a><a class="nav-row"><svg><use href="#laptop"/></svg>Devices</a><a class="nav-row"><svg><use href="#trash"/></svg>Delete account</a><div class="section-label">Developer</div><a class="nav-row active"><svg><use href="#key"/></svg>Access tokens</a><a class="nav-row"><svg><use href="#bot"/></svg>Applications</a><div class="section-label">Instance</div><a class="nav-row"><svg><use href="#server"/></svg>Instance settings</a><a class="nav-row"><svg><use href="#shield"/></svg>Policies</a><a class="nav-row"><svg><use href="#eye"/></svg>Transparency report</a><div class="hairline-t" style="margin-top:auto;padding-top:8px"><a class="nav-row"><svg><use href="#logout"/></svg>Sign out</a></div></nav><div class="body-pane"><div class="inner"><div class="flex between center"><div class="col gap-xs"><h2 class="t-heading-xl">Access tokens</h2><p class="mute t-body-sm">Tokens let scripts use the API as you. Treat them like passwords.</p></div><button class="btn btn-primary">Create token</button></div><div class="card flush"><div class="list-row"><div class="col grow"><span class="t-body-sm-strong">Backup script <code>gt_pat_4kQ…</code></span><span class="t-caption-md mute"><span class="badge">read</span> <span class="badge">gateway</span> · Last used 3 h ago · expires in 26 days</span></div><button class="btn btn-danger small">Revoke</button></div><div class="list-row"><div class="col grow"><span class="t-body-sm-strong">CI notifier</span><span class="t-caption-md mute"><span class="badge">read</span> <span class="badge">write</span> · Never used · never expires</span></div><button class="btn btn-danger small">Revoke</button></div><div class="list-row"><div class="col grow"><span class="t-body-sm-strong">Old deploy key <span class="badge">Expired</span></span><span class="t-caption-md mute">Last used 84 days ago</span></div><button class="btn btn-danger small">Revoke</button></div></div><p class="t-caption-md mute">Up to 25 tokens.</p></div></div></div></div><figcaption>Access tokens. Shown in account settings; users can revoke their own tokens and administrators may keep admin scope.</figcaption></figure>

      <figure class="frame"><div class="win short"><div class="chrome"><span class="title">Gotalk</span></div><div class="viewport"><div class="main"></div><div class="scrim"><div class="card dialog" style="width:470px;background:var(--gt-color-surface-elevated);border-color:var(--gt-color-hairline-strong);border-radius:var(--gt-radius-xl)"><h2 class="t-heading-md">Create token</h2><div class="field"><label>Name</label><div class="input focus"><span>Backup script</span></div></div><div class="field"><label>Access</label><label class="check"><span class="box on"><svg><use href="#check"/></svg></span><span>Read <span class="note">GET requests</span></span></label><label class="check"><span class="box"></span><span>Write <span class="note">Everything else: posting, editing, moderating</span></span></label><label class="check"><span class="box on"><svg><use href="#check"/></svg></span><span>Gateway <span class="note">Real-time events over WebSocket</span></span></label><label class="check"><span class="box"></span><span>Admin <span class="note">Keep instance administrator powers</span></span></label></div><div class="field"><label>Expires</label><div class="pills"><span class="pill">7 days</span><span class="pill active">30 days</span><span class="pill">90 days</span><span class="pill">1 year</span><span class="pill">Never</span></div></div><div class="flex gap-sm" style="justify-content:flex-end"><button class="btn btn-tertiary">Cancel</button><button class="btn btn-primary">Create token</button></div></div></div></div></div><figcaption>Create token dialog. Admin access appears only for instance administrators and is checked server-side.</figcaption></figure>

      <figure class="frame"><div class="win short"><div class="chrome"><span class="title">Gotalk</span></div><div class="viewport"><div class="main"></div><div class="scrim"><div class="card dialog" style="width:490px;background:var(--gt-color-surface-elevated);border-color:var(--gt-color-hairline-strong);border-radius:var(--gt-radius-xl)"><h2 class="t-heading-md">Copy your token now</h2><p class="mute t-body-sm">You won't see it again. If you lose it, revoke it and create another.</p><div class="linkbox"><span>gt_pat_4kQ9v4fZbdPxS8v6LrN2</span><button class="btn btn-primary small">Copy</button></div><div class="flex" style="justify-content:flex-end"><button class="btn btn-tertiary">Done</button></div></div></div></div></div><figcaption>Token created dialog. The secret is shown once; Done closes it after the person copies or stores it.</figcaption></figure>

      <figure class="frame"><div class="win short"><div class="chrome"><div class="dots"><i></i><i></i><i></i></div><div class="url">app.gotalk.io/settings/apps</div></div><div class="viewport"><nav class="settings-nav"><a class="nav-row"><svg><use href="#key"/></svg>Access tokens</a><a class="nav-row active"><svg><use href="#bot"/></svg>Applications</a></nav><div class="body-pane"><div class="inner"><div class="flex between center"><div class="col gap-xs"><h2 class="t-heading-xl">Applications</h2><p class="mute t-body-sm">An application has a bot account that can join places, answer slash commands and use the API.</p></div><button class="btn btn-primary">New application</button></div><div class="card flush"><div class="list-row"><span class="tile s36 blue"><svg class="i"><use href="#clock"/></svg></span><div class="col grow"><span class="t-body-sm-strong">Shop Timer</span><span class="t-caption-md mute">@shoptimer · Public · 3 commands</span></div><svg class="i mute"><use href="#chevronRight"/></svg></div><div class="list-row"><span class="tile s36 yellow">G</span><div class="col grow"><span class="t-body-sm-strong">Glue Reminder</span><span class="t-caption-md mute">@gluebot · Private</span></div><svg class="i mute"><use href="#chevronRight"/></svg></div></div></div></div></div></div><figcaption>Applications list. Available from account settings to any signed-in person; each application owns one bot account.</figcaption></figure>

      <figure class="frame"><div class="win short"><div class="chrome"><span class="title">Gotalk</span></div><div class="viewport"><nav class="settings-nav"><a class="nav-row active"><svg><use href="#bot"/></svg>Applications</a></nav><div class="body-pane scroll-y"><div class="inner"><h2 class="t-heading-xl">Shop Timer</h2><div class="card compact"><span class="t-body-sm-strong">General</span><div class="field"><label>Name</label><div class="input"><span>Shop Timer</span></div></div><div class="field"><label>Description</label><div class="input"><span>Run shared shop timers from slash commands.</span></div></div><div class="field"><label>Icon URL</label><div class="input"><span class="ph">https://example.com/timer.png</span></div></div><label class="check"><span class="box on"><svg><use href="#check"/></svg></span><span>Public — anyone with Manage place can add the bot to their place</span></label><button class="btn btn-outline small">Save</button></div><div class="card compact"><span class="t-body-sm-strong">Bot</span><p class="t-body-sm">@shoptimer · <code>Application ID 0193…e7</code></p><div class="flex gap-sm wrap"><button class="btn btn-tertiary">Copy ID</button><button class="btn btn-outline">Reset token</button><button class="btn btn-tertiary">Add to a place</button></div></div><div class="card flush"><div class="list-row"><span class="grow"><code>/timer</code> start a shop timer · 2 options</span><svg class="i mute"><use href="#edit"/></svg></div><div class="list-row"><span class="grow"><code>/glue</code> remind the channel</span><svg class="i mute"><use href="#edit"/></svg></div></div><div class="flex between center"><button class="btn btn-tertiary small">Add command</button><span class="t-caption-md mute">Changes are saved together.</span><button class="btn" disabled>Save commands</button></div><div class="hairline-t flex between center" style="padding-top:12px"><span class="t-body-sm-strong danger">Delete application</span><button class="btn btn-danger">Delete application</button></div></div></div></div></div><figcaption>Application page. The owner edits the bot, slash commands and public availability; clean command changes leave Save disabled.</figcaption></figure>

      <figure class="frame"><div class="win short"><div class="chrome"><span class="title">Gotalk</span></div><div class="viewport"><div class="main"></div><div class="scrim"><div class="card dialog scroll-y" style="width:540px;max-height:560px;background:var(--gt-color-surface-elevated);border-color:var(--gt-color-hairline-strong);border-radius:var(--gt-radius-xl)"><h2 class="t-heading-md">Command</h2><div class="field"><label>Name</label><div class="input"><span class="mute">/</span><span>timer</span></div></div><div class="field"><label>Description</label><div class="input"><span>Start a shop timer</span></div></div><div class="option-card"><div class="flex between"><span class="t-body-sm-strong">Option</span><button class="btn btn-tertiary small"><svg class="i"><use href="#x"/></svg></button></div><div class="field"><label>Name</label><div class="input"><span>minutes</span></div></div><div class="field"><label>Type</label><div class="pills"><span class="pill">Text</span><span class="pill active">Integer</span><span class="pill">Number</span><span class="pill">True/false</span><span class="pill">User</span><span class="pill">Channel</span></div></div><label class="check"><span class="box on"><svg><use href="#check"/></svg></span><span>Required</span></label></div><button class="btn btn-tertiary small">Add option</button><div class="flex gap-sm" style="justify-content:flex-end"><button class="btn btn-tertiary">Cancel</button><button class="btn btn-primary">Done</button></div></div></div></div></div><figcaption>Command editor. Application owners define options before saving the command set together.</figcaption></figure>

      <figure class="frame"><div class="win short"><div class="chrome"><span class="title">Gotalk</span></div><div class="viewport"><div class="main"></div><div class="scrim"><div class="card dialog" style="width:460px;background:var(--gt-color-surface-elevated);border-color:var(--gt-color-hairline-strong);border-radius:var(--gt-radius-xl)"><h2 class="t-heading-md">Add to a place</h2><p class="mute t-body-sm">Places where you have Manage place.</p><div class="card flush"><div class="list-row"><span class="tile s32 yellow">O</span><span class="grow t-body-sm-strong">Open Woodworkers</span><button class="btn btn-outline small">Add</button></div><div class="list-row"><span class="tile s32 blue">H</span><span class="grow t-body-sm-strong">Hand Tools</span><span class="badge success">Added</span></div></div></div></div></div></div><figcaption>Add to a place dialog. Only places where the person has Manage place are listed.</figcaption></figure>

      <figure class="frame"><div class="win short"><div class="chrome"><span class="title">Gotalk</span></div><div class="viewport"><div class="rail"><div class="tile yellow place active">O</div></div><aside class="sidebar"><div class="head"><span class="t-body-strong">Open Woodworkers</span></div></aside><div class="main"><div class="topbar"><span class="t-body-strong">Webhooks</span></div><div class="mini-shell"><nav class="place-nav hairline-r"><div class="section-label">Integrations</div><a class="nav-row active"><svg><use href="#link"/></svg>Webhooks</a><a class="nav-row"><svg><use href="#bot"/></svg>Bots</a></nav><div class="body-pane"><div class="inner"><div class="flex between center"><div class="col gap-xs"><h2 class="t-heading-xl">Webhooks</h2><p class="mute t-body-sm">Send signed events from Open Woodworkers to another service.</p></div><button class="btn btn-primary">Create webhook</button></div><div class="card flush"><div class="list-row"><div class="col grow"><span class="t-body-sm-strong">Discord bridge <span class="badge success">Active</span></span><span class="t-caption-md mute"><code>https://bridge.example.com/hooks/…</code> · 4 events · last delivery 2 min ago</span></div><svg class="i mute"><use href="#chevronRight"/></svg></div><div class="list-row"><div class="col grow"><span class="t-body-sm-strong">Old CRM <span class="badge warning">Failing · 3 in a row</span></span><span class="t-caption-md mute">member.join, report.create</span></div><svg class="i mute"><use href="#chevronRight"/></svg></div><div class="list-row"><div class="col grow"><span class="t-body-sm-strong">Archive <span class="badge">Disabled</span></span><span class="t-caption-md mute">Turned off after 6 failed attempts</span></div><svg class="i mute"><use href="#chevronRight"/></svg></div></div></div></div></div></div></div></div><figcaption>Webhooks. Requires Manage webhooks; each place can have up to 10 outgoing webhooks.</figcaption></figure>

      <figure class="frame"><div class="win short"><div class="chrome"><span class="title">Gotalk</span></div><div class="viewport"><div class="main"></div><div class="scrim"><div class="card dialog" style="width:520px;background:var(--gt-color-surface-elevated);border-color:var(--gt-color-hairline-strong);border-radius:var(--gt-radius-xl)"><h2 class="t-heading-md">Create webhook</h2><div class="field"><label>Name</label><div class="input"><span>Discord bridge</span></div></div><div class="field"><label>URL</label><div class="input"><span>https://bridge.example.com/hooks/gotalk</span></div></div><div class="field"><label>Events</label><div class="events"><label class="check"><span class="box on"><svg><use href="#check"/></svg></span><span>member.join</span></label><label class="check"><span class="box"></span><span>member.leave</span></label><label class="check"><span class="box on"><svg><use href="#check"/></svg></span><span>message.create</span></label><label class="check"><span class="box"></span><span>message.update</span></label><label class="check"><span class="box"></span><span>message.delete</span></label><label class="check"><span class="box"></span><span>post.create</span></label><label class="check"><span class="box"></span><span>topic.create</span></label><label class="check"><span class="box on"><svg><use href="#check"/></svg></span><span>report.create</span></label><label class="check"><span class="box on"><svg><use href="#check"/></svg></span><span>moderation.action</span></label></div></div><div class="flex gap-sm" style="justify-content:flex-end"><button class="btn btn-tertiary">Cancel</button><button class="btn btn-primary">Create</button></div></div></div></div></div><figcaption>Create webhook. Requires Manage webhooks; events are explicit so the destination receives only what it needs.</figcaption></figure>

      <figure class="frame"><div class="win short"><div class="chrome"><span class="title">Gotalk</span></div><div class="viewport"><div class="main"></div><div class="scrim"><div class="card dialog" style="width:490px;background:var(--gt-color-surface-elevated);border-color:var(--gt-color-hairline-strong);border-radius:var(--gt-radius-xl)"><h2 class="t-heading-md">Copy the signing secret now</h2><p class="mute t-body-sm">Verify each request with the Gotalk-Signature header.</p><div class="linkbox"><span>gt_whsec_0193f8b29dbb7</span><button class="btn btn-primary small">Copy</button></div><button class="btn btn-tertiary" style="align-self:flex-end">Done</button></div></div></div></div><figcaption>Signing secret. Requires Manage webhooks; the secret is shown once after creation or rotation.</figcaption></figure>

      <figure class="frame"><div class="win short"><div class="chrome"><span class="title">Gotalk</span></div><div class="viewport"><div class="rail"><div class="tile yellow place active">O</div></div><div class="main"><div class="topbar"><span class="t-body-strong">Discord bridge</span><span class="badge success">Active</span><span style="margin-left:auto" class="flex gap-sm"><button class="btn btn-tertiary small">Send ping</button><button class="btn btn-tertiary small">Rotate secret</button><button class="btn btn-danger small">Delete</button></span></div><div class="body-pane scroll-y"><div class="inner"><div class="card compact"><span class="t-body-sm-strong">Settings</span><p class="t-caption-md mute">URL https://bridge.example.com/hooks/… · 4 events · Active</p><button class="btn btn-outline small">Save</button></div><div class="pills"><span class="pill active">All</span><span class="pill">Pending</span><span class="pill">Succeeded</span><span class="pill">Failed</span></div><div class="card flush"><div class="list-row"><code>message.create</code><span class="badge success">200</span><span class="grow t-caption-md mute">182 ms · 1 attempt</span><span class="t-caption-md mute">2 min</span></div><div class="list-row"><code>report.create</code><span class="badge danger">500</span><span class="grow t-caption-md mute">3 attempts</span><span class="t-caption-md mute">8 min</span></div><div class="list-row"><div class="col grow"><span><code>moderation.action</code> <span class="badge">Pending · retry in 4 min</span></span><pre>{ "event": "moderation.action", "place": "open-woodworkers" }</pre><span class="t-caption-md danger">Error: Connection refused</span></div><button class="btn btn-outline small">Redeliver</button></div></div></div></div></div></div></div><figcaption>Webhook page. Requires Manage webhooks; failed deliveries show status, attempts, payload and a redeliver action.</figcaption></figure>

      <figure class="frame"><div class="win short"><div class="chrome"><span class="title">Gotalk</span></div><div class="viewport"><div class="rail"><div class="tile yellow place active">O</div></div><div class="main"><div class="topbar"><span class="t-body-strong">Bots</span></div><div class="mini-shell"><nav class="place-nav hairline-r"><div class="section-label">Integrations</div><a class="nav-row"><svg><use href="#link"/></svg>Webhooks</a><a class="nav-row active"><svg><use href="#bot"/></svg>Bots</a></nav><div class="body-pane"><div class="inner"><div class="col gap-xs"><h2 class="t-heading-xl">Bots</h2><p class="mute t-body-sm">Add an application's bot to Open Woodworkers. It joins as a member and gets the @everyone role; give it more with roles.</p></div><div class="field"><label>Application ID</label><div class="input"><span>0193f8b29dbbe7</span><button class="btn btn-primary" style="margin-left:auto">Add bot</button></div></div><div class="card flush"><div class="list-row"><span class="tile s32 blue"><svg class="i"><use href="#clock"/></svg></span><div class="col grow"><span class="t-body-sm-strong">Shop Timer</span><span class="t-caption-md mute">Your application</span></div><button class="btn btn-outline small">Add</button></div><div class="list-row"><span class="tile s32 yellow">G</span><div class="col grow"><span class="t-body-sm-strong">Glue Reminder</span><span class="t-caption-md mute">Private application</span></div><button class="btn btn-outline small">Add</button></div></div><p class="t-caption-md mute">Private applications can only be added by their owner.</p></div></div></div></div></div></div><figcaption>Bots. Requires Manage place; private applications are only addable by their owner.</figcaption></figure>
    </div>
  </section>

  <section class="group"><h2>Phone</h2><div class="frames">
    <figure class="frame"><div class="phone"><div class="status"><span>9:41</span><span class="t-caption-sm">5G</span></div><div class="appbar"><span class="side on-dark"><svg class="i"><use href="#chevronLeft"/></svg></span><span class="t-body-sm-strong">Access tokens</span><span class="side end on-dark"><svg class="i"><use href="#plus"/></svg></span></div><div class="body"><div class="card flush"><div class="list-row"><div class="col grow"><span class="t-body-sm-strong">Backup script</span><span class="t-caption-md mute">read, gateway · expires in 26 days</span></div><button class="btn btn-danger small">Revoke</button></div><div class="list-row"><div class="col grow"><span class="t-body-sm-strong">CI notifier</span><span class="t-caption-md mute">Never used · never expires</span></div><button class="btn btn-danger small">Revoke</button></div></div></div><div class="home-bar"></div></div><figcaption>Phone access tokens. Users can create or revoke tokens from account settings.</figcaption></figure>
    <figure class="frame"><div class="phone"><div class="status"><span>9:41</span><span class="t-caption-sm">5G</span></div><div class="appbar"><span class="side"></span><span class="t-body-sm-strong">Access tokens</span><span class="side"></span></div><div class="body flush"></div><div class="scrim" style="align-items:flex-end"></div><div class="sheet"><div class="grab"></div><h2 class="t-heading-md">Copy your token now</h2><p class="mute t-body-sm">You won't see it again.</p><div class="linkbox"><span>gt_pat_4kQ9v4fZbdPx</span></div><button class="btn btn-primary block">Copy</button><button class="btn btn-tertiary block">Done</button></div><div class="home-bar"></div></div><figcaption>Phone token created sheet. The secret is shown once and should be copied before closing.</figcaption></figure>
    <figure class="frame"><div class="phone"><div class="status"><span>9:41</span><span class="t-caption-sm">5G</span></div><div class="appbar"><span class="side on-dark"><svg class="i"><use href="#chevronLeft"/></svg></span><span class="t-body-sm-strong">Shop Timer</span><span class="side end on-dark">Save</span></div><div class="body"><div class="field"><label>Name</label><div class="input"><span>Shop Timer</span></div></div><label class="check"><span class="box on"><svg><use href="#check"/></svg></span><span>Public</span></label><div class="card compact"><span class="t-body-sm-strong">Bot</span><span class="t-caption-md mute">@shoptimer · Application ID 0193…e7</span><button class="btn btn-tertiary small">Add to a place</button></div><div class="card flush"><div class="list-row"><code>/timer</code><span class="grow t-caption-md mute">2 options</span></div><div class="list-row"><code>/glue</code><span class="grow t-caption-md mute">0 options</span></div></div></div><div class="home-bar"></div></div><figcaption>Phone application page. Owners can edit bot metadata and slash commands.</figcaption></figure>
