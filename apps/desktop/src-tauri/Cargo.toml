[package]
name = "gotalk-desktop"
version = "0.1.0"
description = "Gotalk desktop client"
edition = "2021"
publish = false

[lib]
# The _lib suffix avoids a name clash with the binary on Windows.
name = "gotalk_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# OS keychain for refresh tokens: Keychain on macOS, Credential Manager on Windows, Secret Service on Linux.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
