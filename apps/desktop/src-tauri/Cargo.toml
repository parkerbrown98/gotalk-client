[package]
name = "gotalk-desktop"
version = "0.1.0"
description = "Gotalk desktop client"
edition = "2021"
license = "MIT"
publish = false

[lib]
# The _lib suffix avoids a name clash with the binary on Windows.
name = "gotalk_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# OS keychain for refresh tokens: Keychain on macOS, Credential Manager on Windows, Secret Service on Linux.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
# generate_context! embeds plugin settings from tauri.conf.json (the gotalk:// scheme) as JSON.
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# Desktop-only plugins: push to talk anywhere on the system while in a voice channel, the system clipboard
# for the in-app context menus, opening links in the default browser, and gotalk:// links (invites, places
# and topics), which on Windows and Linux start a second process that hands the link to the running one.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-clipboard-manager = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
